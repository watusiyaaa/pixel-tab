    <!-- Main Dashboard -->
    <main class="box" aria-label="Pixel Tab dashboard">
      <!-- Top -->
      <header class="top">
        <h1 class="time">
          <time id="clock-time" datetime=""></time
          ><span id="clock-period" class="am_pm"></span>
        </h1>
        <p class="date-weather">
          <time id="current-date" datetime=""></time
          ><span aria-hidden="true">|</span
          ><span id="weather-info" aria-live="polite">Loading weather...</span>
          <!-- == COMMENTED OUT BUT MIGHT NEED IN THE FUTURE == <a
            class="weather-attribution"
            href="https://open-meteo.com/"
            aria-label="Weather data by Open-Meteo"
            >Open-Meteo</a
          > -->
        </p>
        <p class="greet"><span class="greet-1">Afternoon</span> Jini!</p>
      </header>

      <hr class="divider" />

      <!-- Bottom -->
      <section class="bottom" aria-label="Search and shortcuts">
        <form
          class="search"
          action="https://www.google.com/search"
          method="get"
          role="search"
        >
          <label class="visually-hidden" for="google-search"
            >Search Google</label
          >
          <input id="google-search" type="search" name="q" autocomplete="off" />
          <button type="submit" aria-label="Search">
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
          </button>
        </form>

        <nav class="shortcut-grid" aria-label="Apps and websites">
          <a class="shortcut" href="https://fmhy.net/">
            <span class="shortcut-art"
              ><svg aria-hidden="true"><use href="#icon-fmhy"></use></svg
            ></span>
            <span class="shortcut-label">FMHY</span>
          </a>
          <a class="shortcut" href="https://olfu.instructure.com/">
            <span class="shortcut-art"
              ><svg aria-hidden="true"><use href="#icon-canvas"></use></svg
            ></span>
            <span class="shortcut-label">Canvas</span>
          </a>
          <a class="shortcut" href="https://www.facebook.com/">
            <span class="shortcut-art"
              ><svg aria-hidden="true"><use href="#icon-facebook"></use></svg
            ></span>
            <span class="shortcut-label">FB</span>
          </a>
          <a class="shortcut" href="https://twitter.com/">
            <span class="shortcut-art"
              ><svg aria-hidden="true"><use href="#icon-twitter"></use></svg
            ></span>
            <span class="shortcut-label">Twitter</span>
          </a>

          <!-- Site folder -->
          <div class="folder-wrapper folder-wrapper--ai">
            <input
              class="folder-toggle"
              type="checkbox"
              id="ai-folder-toggle"
              aria-label="AI folder"
              aria-controls="ai-folder-panel"
            />
            <label class="shortcut folder-trigger" for="ai-folder-toggle">
              <span class="folder-preview" aria-hidden="true">
                <svg><use href="#icon-chatgpt"></use></svg>
                <svg><use href="#icon-claude"></use></svg>
                <svg><use href="#icon-deepseek"></use></svg>
                <svg><use href="#icon-gemini"></use></svg>
              </span>
              <span class="shortcut-label">AI</span>
            </label>

            <section
              class="folder-panel"
              id="ai-folder-panel"
              aria-labelledby="ai-folder-title"
            >
              <header class="folder-panel-header">
                <h2 id="ai-folder-title">AI</h2>
                <label class="folder-close" for="ai-folder-toggle">Close</label>
              </header>
              <nav class="folder-grid" aria-label="AI applications">
                <a class="folder-app" href="https://chatgpt.com/">
                  <span class="folder-app-art"
                    ><svg aria-hidden="true">
                      <use href="#icon-chatgpt"></use></svg
                  ></span>
                  <span class="folder-app-label">ChatGPT</span>
                </a>
                <a class="folder-app" href="https://claude.ai/">
                  <span class="folder-app-art"
                    ><svg aria-hidden="true">
                      <use href="#icon-claude"></use></svg
                  ></span>
                  <span class="folder-app-label">Claude</span>
                </a>
                <a class="folder-app" href="https://chat.deepseek.com/">
                  <span class="folder-app-art"
                    ><svg aria-hidden="true">
                      <use href="#icon-deepseek"></use></svg
                  ></span>
                  <span class="folder-app-label">DeepSeek</span>
                </a>
                <a class="folder-app" href="https://gemini.google.com/">
                  <span class="folder-app-art"
                    ><svg aria-hidden="true">
                      <use href="#icon-gemini"></use></svg
                  ></span>
                  <span class="folder-app-label">Gemini</span>
                </a>
                <a class="folder-app" href="https://aistudio.google.com/">
                  <span class="folder-app-art"
                    ><svg aria-hidden="true">
                      <use href="#icon-google-ai-studio"></use></svg
                  ></span>
                  <span class="folder-app-label">Google AI Studio</span>
                </a>
              </nav>
            </section>
          </div>
        </nav>
      </section>
    </main>

</html>
